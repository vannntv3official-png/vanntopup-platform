name: CI — Cambodia Game Top-Up Platform

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel + PostgreSQL + PHPUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: topup_test
          POSTGRES_USER: topup_user
          POSTGRES_PASSWORD: topup_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_pgsql, pgsql, mbstring, openssl
          coverage: none
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Security audit (Composer)
        working-directory: backend
        run: composer audit --no-interaction
      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.testing.example .env
          php artisan key:generate
      - name: Run migrations & automated test suite
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: topup_test
          DB_USERNAME: topup_user
          DB_PASSWORD: topup_password
          QUEUE_CONNECTION: sync
        run: php artisan test --stop-on-failure

  frontend:
    name: Frontend (Nuxt Storefront & Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        run: pnpm test:frontend
      - name: Build Storefront & Admin for production
        run: pnpm build

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
